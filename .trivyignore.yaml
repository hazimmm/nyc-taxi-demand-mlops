# Known vulnerabilities that CI accepts for a limited time.
#
# Read by Trivy (the image scan) and by tools/audit_dependencies.py (pip-audit on the
# lock files), so both scanners accept the same list. Each entry says why the finding
# does not threaten this project and until when that is accepted. On the day
# `expired_at` is reached the entry stops applying, the finding comes back and CI
# fails, so nothing stays accepted by being forgotten.
#
# Entries with a fix expire on 2026-11-04: the day the last of the fixes is two weeks old,
# which is the project's rule for taking a new release (a compromised release is
# usually found and pulled within days). The upgrade is made on that day. Entries
# without a fix are reviewed on 2026-12-01.

vulnerabilities:
  # certifi
  - id: GHSA-6q48-6c7w-9gw2
    statement: "certifi 2026.7.22 trusts the emSign ECC Root CA - G3, whose intermediate CAs have leaked keys. Used for HTTPS to the data sources and to PyPI; an attack needs a position on the network and one of those keys. Fixed in 2026.10.19 (20 Oct)."
    expired_at: 2026-11-04
  # uv
  - id: GHSA-hq85-5cpj-mr62
    statement: "uv 0.13.0 has the same leaked root in its own CA bundle. A development tool, used to compile the lock files. Fixed in 0.13.4 (20 Oct)."
    expired_at: 2026-11-04
  # mlflow
  - id: CVE-2026-53995
    statement: "Path traversal through a trace ID in the FileStore tracking backend. The project's MLflow servers use the SQLite backend, and none is reachable from outside the machine or the cluster. Fixed in 3.17.2 (21 Oct)."
    expired_at: 2026-11-04
  # gitpython
  - id: CVE-2026-114145
    statement: "create_submodule can clone into .git/hooks. MLflow and DVC only read the repository and never add submodules. Fixed in 3.2.1 (14 Oct)."
    expired_at: 2026-11-04
