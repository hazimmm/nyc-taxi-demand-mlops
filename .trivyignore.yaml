  # nltk
  - id: CVE-2026-81726
    statement: "No fix released. Model-file APIs accept paths outside the NLTK data folder. NLTK comes with Evidently; the project's drift checks are on numbers and never load an NLTK model."
    expired_at: 2026-12-01
  # diskcache
  - id: CVE-2025-69872
    statement: "No fix released. diskcache unpickles what is in its cache folder, so an attacker who can write there can run code. It is DVC's local cache inside the project folder; writing there already means the machine is compromised."
    expired_at: 2026-12-01
