[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "demand"
version = "0.1.0"
description = "Day-ahead hourly taxi demand forecasting for NYC zones, with a full MLOps stack."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.0",
    "holidays>=0.50",
    "httpx>=0.27",
    "pandas>=2.2",
    "pandera[pandas]>=0.24",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.3",
    "matplotlib>=3.9",
    "mlflow>=2.14",
    "optuna>=3.6",
    "scikit-learn>=1.5",
    "shap>=0.45",
]
serving = [
    "fastapi>=0.111",
    "prometheus-client>=0.20",
    "uvicorn[standard]>=0.30",
]
monitoring = [
    "evidently>=0.4.30",
    "prometheus-client>=0.20",
]
orchestration = [
    "prefect>=3.0",
]
versioning = [
    "dvc>=3.50",
]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "uv>=0.4",
]
all = ["demand[ml,serving,monitoring,orchestration,versioning,dev]"]

[project.scripts]
demand = "demand.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/demand"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PTH", "C4", "D", "RUF"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "evidently.*",
    "lightgbm.*",
    "mlflow.*",
    "prometheus_client.*",
    "shap.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=demand --cov-report=term-missing"
markers = [
    "integration: end-to-end tests that run several pipeline stages on the fixture dataset",
]

[tool.coverage.run]
branch = true
source = ["demand"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
