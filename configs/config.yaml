# Single source of configuration. Any value can be overridden with an environment
# variable: prefix DEMAND_, nested keys joined by a double underscore,
# e.g. DEMAND_MLFLOW__TRACKING_URI=http://mlflow:5000

project:
  name: nyc-taxi-demand
  seed: 42
  timezone: America/New_York

paths:
  data_dir: data
  reports_dir: reports

data:
  tlc_url_template: "https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{year}-{month:02d}.parquet"
  zone_lookup_url: "https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv"
  start_month: "2025-01"
  end_month: "2025-06"
  # Last day the model is allowed to learn from. Everything after it is replayed
  # as "production" by the simulated clock.
  # Quoted like the months above: without quotes YAML reads a date object, and DVC
  # cannot store one in dvc.lock.
  train_end_date: "2025-04-30"
  # Download behaviour. A timeout limits one network operation, not a whole file.
  download:
    max_attempts: 4            # tries per file for transient failures (network, 5xx, 429)
    backoff_base_seconds: 1.0  # wait 1 s, 2 s, 4 s ... between tries
    connect_timeout_seconds: 10.0
    read_timeout_seconds: 60.0
  n_zones: 20
  # Frozen list of pickup zone IDs, chosen from the training period only.
  # Output of `python -m demand select-zones`, busiest first. Run it again and paste the
  # result here only when train_end_date changes.
  zones: [161, 237, 236, 132, 230, 186, 162, 142, 234, 170, 163, 239, 68, 138, 79, 48, 249, 141, 164, 140]
  weather:
    latitude: 40.7128
    longitude: -74.0060
    forecast_url: "https://historical-forecast-api.open-meteo.com/v1/forecast"
    archive_url: "https://archive-api.open-meteo.com/v1/archive"
    variables:
      - temperature_2m
      - precipitation
      - snowfall
      - wind_speed_10m

cleaning:
  min_duration_minutes: 1.0
  max_duration_hours: 6.0
  max_distance_miles: 100.0
  min_passengers: 1
  max_passengers: 8
  max_zone_id: 263          # 264 and 265 are "Unknown" / "Outside of NYC"
  max_weather_gap_hours: 3  # longest weather gap that is interpolated

features:
  # No feature of hour t reads pickups newer than t - 48 h. With 48 the forecast for a
  # whole day can be issued at 00:00 on the day before it. With 24 it could only be
  # issued at 00:00 on the day itself. No lag may be shorter than the horizon, so a
  # lag of 24 ("the same hour yesterday") is not allowed.
  horizon_hours: 48
  lags: [48, 168]
  rolling_windows: [24, 168]
  outlier_zscore: 4.0

model:
  # Output of `python -m demand tune` (30 trials on the four April folds), pasted by
  # hand. Backtest MAE 24.14 against 25.04 with the parameters before (learning_rate
  # 0.05, num_leaves 63, min_child_samples 20, subsample 0.8), mean of three seeds,
  # better in all four folds. A search on March weeks only, scored on April, kept about
  # 0.64 of that 0.90. Run it again only when the features or the training period change.
  params:
    objective: poisson
    learning_rate: 0.104
    n_estimators: 600
    num_leaves: 110
    min_child_samples: 161
    subsample: 0.85
    subsample_freq: 1
    colsample_bytree: 0.8
    verbosity: -1
  tuning_trials: 30
  tuning_timeout_seconds: 900

backtest:
  n_folds: 4
  fold_days: 7

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: taxi-demand
  registered_model_name: taxi-demand
  champion_alias: champion
  challenger_alias: challenger

serving:
  model_uri: "models:/taxi-demand@champion"
  host: 0.0.0.0
  port: 8000

monitoring:
  reference_days: 28
  window_days: 7
  drift_share_threshold: 0.3      # share of drifted inputs that raises a warning (never an alert)
  mae_degradation_ratio: 1.25     # live MAE / backtest MAE that raises an alert
  retrain_cooldown_days: 7
